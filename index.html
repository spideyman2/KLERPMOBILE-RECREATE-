<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>KL ERP</title>
    <link rel="stylesheet" href="kl.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" >
    <link rel="icon" href="image.png ">
    
</head>
<body>
    <div class="container">      
        <div class="div1">

       <div class="img-container">
         <img src="klh.png" alt="">
         
       </div>
       
    </div>
    <div class="div2">
        <div class="klh-div">
    <div class="logos">
        <img src="ims.png" alt="" class="photo-id">
        <img src="ims.png" alt="" class="photo-id">
    </div>
   <button> <i class="fa-solid fa-gear " id="settings_btn"></i></button>
</div>

        <div class="login-div">
            
           <p id="login-text"> <strong>Login</strong></p>
          <label for="text"></label><br>
         <center>  <input type="text" id="user" placeholder="Enter Username *" required></center>
            
            <p id="blank_username" style="color:  #b9000e; font-size: 18px;">Username cannot be blank</p>
            <label for="password"></label><br>
        <center>   <input type="password" id="password" placeholder="Enter Password *" required></center>
           <p id="blank_password" style="color: b9000e; font-size: 18px;">Password cannot be blank</p>

             
          <div class="rem"> <input type="checkbox" id="check">   
           <label for="check" >Remember me </label></div>
          
           <br> 
           <center>  <img src="error.png" alt="" id="error_image">
             <input type="text" id="error" placeholder="Enter verification code" required></center>
           <div class="reset-div">
            <button id="forgot_password" class="red_option"><p class="red-p">Forgot password?</p></button>
            <button class="red_option"><p class="red-p">Parent Registration?</p></button>
            <button class="red_option"><p class="red-p">MFA Registration?</p>    </button>
            
           </div>
           <center>
            <button  onclick="login()"  id="btn">
                Login
            </button>
           </center> 
        </div>
       
    </div>
      
    </div>

    <script src="kl.js"></script>
</body>
</html>
